<!DOCTYPE html>
<html lang="hi">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Serverless Ticket Booking</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #f0f2f5;
      margin: 0;
      padding: 30px;
    }

    h1 {
      text-align: center;
      color: #1a73e8;
    }

    .container {
      max-width: 600px;
      margin: 0 auto;
    }

    .event-card {
      background: white;
      padding: 20px;
      border-radius: 10px;
      margin-bottom: 20px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    }

    .event-card h3 {
      margin-top: 0;
      color: #333;
    }

    .btn {
      background: #28a745;
      color: white;
      border: none;
      padding: 10px 18px;
      border-radius: 5px;
      cursor: pointer;
      font-size: 16px;
      font-weight: bold;
    }

    .btn:disabled {
      background: #ccc;
      cursor: not-allowed;
    }

    .form-group {
      margin-top: 15px;
      display: flex;
      gap: 10px;
    }

    input {
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 5px;
      flex: 1;
    }
  </style>
</head>

<body>

  <div class="container">
    <h1>🎟️ Serverless Ticket Booking</h1>
    <div id="events-list">Loading events...</div>
  </div>

  <script>
    // Aapka exact live API URL
    const API_URL = "https://YOUR_API_ID.execute-api.us-east-1.amazonaws.com";

    async function fetchEvents() {
      try {
        const response = await fetch(`${API_URL}/events`);
        const events = await response.json();

        const container = document.getElementById("events-list");
        container.innerHTML = "";

        if (!Array.isArray(events) || events.length === 0) {
          container.innerHTML = "<p>No active events found in DynamoDB.</p>";
          return;
        }

        events.forEach(event => {
          const card = document.createElement("div");
          card.className = "event-card";
          card.innerHTML = `
            <h3>${event.eventName || "Event"}</h3>
            <p><strong>Event ID:</strong> ${event.eventId}</p>
            <p><strong>Available Seats:</strong> <span>${event.availableSeats}</span></p>
            
            <div class="form-group">
              <input type="email" id="email-${event.eventId}" placeholder="Enter email" required />
              <button class="btn" onclick="bookTicket('${event.eventId}')" ${event.availableSeats <= 0 ? "disabled" : ""}>
                ${event.availableSeats > 0 ? "Book Ticket" : "Sold Out"}
              </button>
            </div>
            <p id="msg-${event.eventId}" style="margin-top: 10px; font-weight: bold;"></p>
          `;
          container.appendChild(card);
        });
      } catch (err) {
        console.error("Failed to Fetch:", err);
        document.getElementById("events-list").innerHTML = "<p style='color:red;'>Failed to load events. Check Browser Console (F12) for details.</p>";
      }
    }

    async function bookTicket(eventId) {
      const email = document.getElementById(`email-${eventId}`).value;
      const msgEl = document.getElementById(`msg-${eventId}`);

      if (!email) {
        alert("Please enter your email!");
        return;
      }

      msgEl.innerText = "Booking in progress...";
      msgEl.style.color = "blue";

      try {
        const response = await fetch(`${API_URL}/book`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            eventId: eventId,
            userEmail: email,
            seatsRequested: 1
          })
        });

        const result = await response.json();

        if (response.ok) {
          msgEl.innerText = `Success! Booking ID: ${result.bookingId}`;
          msgEl.style.color = "green";
          fetchEvents(); // Refresh seats count
        } else {
          msgEl.innerText = result.message || "Booking failed.";
          msgEl.style.color = "red";
        }
      } catch (err) {
        msgEl.innerText = "Error booking ticket.";
        msgEl.style.color = "red";
      }
    }

    fetchEvents();
  </script>
</body>

</html>
